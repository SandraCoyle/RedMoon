# Bygger Rød Måne til Android og lægger en installerbar APK-fil under "Artifacts" på kørslen.
# Kører ved push og kan startes manuelt (Actions → "Android APK" → "Run workflow").
name: Android APK

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: write   # kræves for at opdatere test-udgivelsen (fast downloadlink til telefonen)

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Run tests
        run: dotnet test tests/RedMoon.Core.Tests -c Release

      - name: Install Android SDK packages the project needs
        run: >
          dotnet build src/RedMoon.App -t:InstallAndroidDependencies -f net10.0-android
          "-p:AndroidSdkDirectory=$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      # Valgfrit: fast signeringsnøgle, så nye versioner kan installeres OVEN PÅ den gamle uden at miste data.
      # Uden de tre secrets signeres APK'en med en midlertidig debug-nøgle, der er ny ved hver kørsel.
      - name: Prepare signing key (only if secrets are set)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/redmoon.keystore"
            {
              echo "args<<EOF"
              echo "-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/redmoon.keystore -p:AndroidSigningKeyAlias=$KEY_ALIAS -p:AndroidSigningKeyPass=env:KEYSTORE_PASSWORD -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Signerer med fast nøgle."
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "Ingen signerings-secrets: bruger midlertidig debug-nøgle."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          dotnet publish src/RedMoon.App -f net10.0-android -c Release
          -p:AndroidPackageFormat=apk
          "-p:AndroidSdkDirectory=$ANDROID_HOME"
          ${{ steps.signing.outputs.args }}

      - name: Collect APK
        run: |
          mkdir -p out
          cp src/RedMoon.App/bin/Release/net10.0-android/publish/*-Signed.apk out/RoedMaane.apk
          ls -la out

      # Viser hvilke tilladelser APK'en beder om (forventet: ingen ud over Androids egne interne).
      - name: Show APK permissions
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT2" dump permissions out/*.apk
          "$AAPT2" dump badging out/*.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label)" || true

      - uses: actions/upload-artifact@v4
        with:
          name: RoedMaane-android-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

      # Fast downloadlink uden login og uden zip – åbn det i Chrome på telefonen:
      # https://github.com/<ejer>/<repo>/releases/download/test-latest/RoedMaane.apk
      # Linket peger altid på den nyeste build.
      - name: Publish APK to the "test-latest" pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest out/RoedMaane.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Rød Måne – testversion" \
            --notes "Automatisk testbuild fra ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Kun til test – ikke en officiel udgivelse. Signeret med en midlertidig nøgle: afinstallér den gamle version før du installerer en ny."
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/test-latest/RoedMaane.apk"
