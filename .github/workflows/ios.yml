# Kompilerer iOS-versionen på en Mac (iPhone-build uden signering).
# Formål: fange fejl i den iOS-specifikke kode. Laver IKKE en app der kan installeres på en iPhone –
# det kræver Apple Developer Program + signering (se README, afsnit "Test på iPhone").
name: iOS build check

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - name: List installed Xcode versions
        run: ls -d /Applications/Xcode*.app

      # .NET for iOS 27.0 kræver Xcode 27, som GitHub's Macs endnu ikke har. Derfor bygges mod
      # iOS 26.0-pakken med den nyeste Xcode 26 (som har simulator-runtimes installeret – dem kræver
      # Xcode's asset-compiler), og .NET's krav om præcis Xcode 26.0 slås fra (ValidateXcodeVersion=false).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Android-workloaden skal også være der, fordi projektet har begge platforme og restore tjekker alle.
      - name: Install MAUI workloads
        run: dotnet workload install maui-ios maui-android

      - name: Show toolchain
        run: |
          xcodebuild -version
          dotnet --version
          dotnet workload list

      # Build til rigtig iPhone (arm64) uden signering – kræver ingen simulator.
      - name: Build for iPhone (unsigned)
        run: >
          dotnet build src/RedMoon.App -c Debug
          -p:TargetFrameworks=net10.0-ios26.0 -f net10.0-ios26.0
          -p:RuntimeIdentifier=ios-arm64
          -p:EnableCodeSigning=false
          -p:ValidateXcodeVersion=false
