# Kompilerer iOS-versionen på en Mac (simulator-build, kræver ingen signering).
# Formål: fange fejl i den iOS-specifikke kode. Laver IKKE en app der kan installeres på en iPhone –
# det kræver Apple Developer Program + signering (se README, afsnit "Test på iPhone").
name: iOS build check

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Show toolchain
        run: |
          xcodebuild -version
          dotnet --version
          dotnet workload list

      - name: Build for iOS simulator (no signing)
        run: >
          dotnet build src/RedMoon.App -f net10.0-ios -c Debug
          -p:RuntimeIdentifier=iossimulator-arm64
